# C30 后端 + 基础设施编排
# 注意:教师端/学生端 Electron 为桌面 GUI,不容器化;仅后端与基础设施容器化。
# mDNS 广播需宿主机网络,server 服务使用 network_mode: host。

services:
  postgres:
    image: postgres:16-alpine
    container_name: c30-postgres
    environment:
      POSTGRES_USER: c30
      POSTGRES_PASSWORD: c30password
      POSTGRES_DB: c30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c30 -d c30"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: c30-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: c30minio
      MINIO_ROOT_PASSWORD: c30miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: c30-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: c30-server
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://c30:c30password@localhost:5432/c30
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: c30minio
      MINIO_SECRET_KEY: c30miniopassword
      JWT_SECRET: ${JWT_SECRET:-c30-mock-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  minio-data:
  redis-data:
