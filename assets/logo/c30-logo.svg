<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- C30 Logo v3 · 教培互动教学系统 -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3882F6"/>
      <stop offset="100%" stop-color="#0F1748"/>
    </linearGradient>
    <clipPath id="rounded-bg">
      <rect x="4" y="4" width="248" height="248" rx="56" ry="56"/>
    </clipPath>
  </defs>

  <!-- Background rounded rect with gradient -->
  <rect x="4" y="4" width="248" height="248" rx="56" ry="56" fill="url(#bg-grad)"/>

  <!-- Top highlight glass effect -->
  <rect x="60" y="4" width="136" height="100" rx="56" ry="56" fill="white" opacity="0.06" clip-path="url(#rounded-bg)"/>

  <!-- C30 text -->
  <text x="128" y="148" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="108" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">C30</text>
  <!-- Text shadow for depth -->
  <text x="129" y="149" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="108" font-weight="bold" fill="rgba(10,15,50,0.2)" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">C30</text>
  <!-- White text on top -->
  <text x="128" y="148" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="108" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">C30</text>

  <!-- Online indicator: green dot with white border -->
  <circle cx="205" cy="51" r="14" fill="white" opacity="0.9"/>
  <circle cx="205" cy="51" r="11" fill="#34D399"/>
  <circle cx="202" cy="48" r="4" fill="#A7F3D0" opacity="0.7"/>

  <!-- Interaction dots at bottom -->
  <line x1="108" y1="202" x2="148" y2="202" stroke="#93C5FD" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="202" r="5" fill="#60A5FA"/>
  <circle cx="128" cy="202" r="4.2" fill="#93C5FD"/>
  <circle cx="156" cy="202" r="3.5" fill="#BFDBFE"/>
</svg>
