# 本地开发基础设施编排:仅 PostgreSQL / MinIO / Redis
# 用法:docker compose -f infra.yaml up -d
# 后端 NestJS 在本地直接跑(node dist/main.js),不在此编排内。

services:
  postgres:
    image: postgres:16-alpine
    container_name: c30-postgres
    environment:
      POSTGRES_USER: c30
      POSTGRES_PASSWORD: c30password
      POSTGRES_DB: c30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c30 -d c30"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: c30-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: c30minio
      MINIO_ROOT_PASSWORD: c30miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: c30-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  minio-data:
  redis-data:
