name: Build Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build NSIS installers (x64)
    # 固定 windows-2022(自带 Visual Studio 2022)。
    # 原因:2026-06 起 GitHub 把 windows-latest 重定向到 windows-2025-vs2026(VS 2026),
    # 而 electron-builder 依赖的 node-gyp 9.4.1 只识别 VS 2019/2022,会报
    # "Could not find any Visual Studio installation to use"(native 重建失败)。
    # 后续升级 node-gyp >= 12.1 后可改回 windows-latest。
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 固定 Python 3.11:Python 3.12+ 移除了 distutils,
      # 而 electron-builder 依赖的 node-gyp 9.4.1 的 gyp 仍 import distutils,
      # 用默认 Python 会报 "No module named 'distutils'"。node-gyp >= 12 可去掉此步。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build teacher app
        run: pnpm --filter @c30/teacher build:win

      - name: Build student app
        run: pnpm --filter @c30/student build:win

      - name: Upload teacher installer
        uses: actions/upload-artifact@v4
        with:
          name: c30-teacher-windows
          path: apps/teacher/release/*.exe

      - name: Upload student installer
        uses: actions/upload-artifact@v4
        with:
          name: c30-student-windows
          path: apps/student/release/*.exe
