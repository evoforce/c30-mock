# 构建 Windows 安装包并发布到 GitHub Release。
#
# 版本由 Changesets 决定，只有两条路径：
#   - 手动运行（推荐，一键发布）：CI 先 pnpm version-packages（消费 .changeset/*.md、
#     提升 package.json 版本、生成各包 CHANGELOG），再提交 chore(release): vX.Y.Z、
#     打 tag、构建，最后用该版本发布 Release；
#   - 推送 tag（本地已 version 过）：只做一致性校验 —— tag 必须等于 package.json 版本，
#     且不能有未消费的 changeset，校验通过才构建发布。
#
# 两端版本由 .changeset/config.json 的 fixed 组保证一致（@c30/teacher + @c30/student）。
#
# 任务编排（并行）：
#   resolve  解析版本 / 校验 tag（一次）
#   build    matrix × 4：教师端 x64、教师端 arm64、学生端 x64、学生端 arm64
#            —— 四个安装包同时构建，互不等待；任一失败则不放行 release
#   release  汇总四个产物 → 生成 SHA256SUMS / Release 说明 → 提交版本变更 + 打 tag → 发布
#
# Release 附件：
#   C30-Teacher-Setup-<version>-x64.exe    教师端安装包（x64）
#   C30-Teacher-Setup-<version>-arm64.exe  教师端安装包（Windows on Arm）
#   C30-Student-Setup-<version>-x64.exe    学生端安装包（x64）
#   C30-Student-Setup-<version>-arm64.exe  学生端安装包（Windows on Arm）
#   SHA256SUMS.txt                        安装包 SHA-256 校验和
name: Build & Release Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "以草稿形式创建 Release（确认后再手动发布）"
        required: false
        default: false
        type: boolean

# 创建 Release、上传附件，以及（手动发布时）提交版本变更与打 tag。
permissions:
  contents: write

# 同一 ref 的发布串行执行，避免两次构建同时往同一个 Release 上传。
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

# 各 job 共用的环境准备：固定 windows-2022 + node 20 + python 3.11 + pnpm。
# 说明（与原单 job 版一致，勿随手改）：
#   · windows-2022 自带 VS 2022：2026-06 起 windows-latest 指向 windows-2025-vs2026，
#     electron-builder 依赖的 node-gyp 9.4.1 只认 VS 2019/2022，会报
#     "Could not find any Visual Studio installation to use"；
#   · Python 3.11：3.12+ 移除 distutils，node-gyp 9.4.1 的 gyp 仍 import 它。

jobs:
  resolve:
    name: Resolve release version
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 校验 tag / changeset 是否对得上需要完整历史与远端 tag
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # 注意:patches/uiohook-napi.patch 改动后 pnpm 的 patch_hash 会变化,
        # 与已提交的 pnpm-lock.yaml 不一致,故这里不能用 --frozen-lockfile。
        run: pnpm install --no-frozen-lockfile

      # 手动发布：吃掉 changeset、提升版本；推 tag：只校验版本与 changeset 是否对得上。
      - name: Resolve release version from changesets
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $changesetDir = Join-Path $PWD '.changeset'

          function Get-AppVersion([string]$app) {
            return (Get-Content (Join-Path $PWD "apps/$app/package.json") -Raw | ConvertFrom-Json).version
          }
          function Get-PendingChangesets {
            return @(Get-ChildItem -Path $changesetDir -Filter '*.md' -File |
              Where-Object { $_.Name -ne 'README.md' } | Select-Object -ExpandProperty Name)
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # 本地 `pnpm version-packages` + 提交 + 打 tag 后推上来的路径：只校验，不改仓库。
            $tag = $env:GITHUB_REF_NAME
            $version = Get-AppVersion 'teacher'
            $studentVersion = Get-AppVersion 'student'

            if ($tag -ne "v$version") {
              throw "tag 与版本不一致：tag=$tag，package.json=$version。请先 pnpm version-packages 并提交版本变更，再打 tag。"
            }
            if ($studentVersion -ne $version) {
              throw "教师端($version)与学生端($studentVersion)版本不一致：两端应在同一 fixed 版本线上，请在 .changeset/config.json 的 fixed 组中同时提升后重试。"
            }
            $pending = Get-PendingChangesets
            if ($pending.Count -gt 0) {
              throw "仍有 $($pending.Count) 个未消费的 changeset：$($pending -join ', ')。请先 pnpm version-packages 并提交，再打 tag。"
            }
            Write-Host "tag 校验通过：$tag（教师端/学生端均为 $version）"
          }
          else {
            # 手动触发：必须在 main 上发布，由 CI 完成 version + 提交 + 打 tag。
            if ($env:GITHUB_REF_NAME -ne 'main') {
              throw "发布请从 main 分支触发（当前：$env:GITHUB_REF_NAME），否则版本提交会落到错误分支。"
            }

            pnpm version-packages
            if ($LASTEXITCODE -ne 0) { throw "changeset version 失败（exit $LASTEXITCODE），请检查 .changeset/*.md 内容。" }

            $version = Get-AppVersion 'teacher'
            $studentVersion = Get-AppVersion 'student'
            if ($studentVersion -ne $version) {
              throw "changeset version 后教师端($version)与学生端($studentVersion)版本不一致，请检查 .changeset/config.json 的 fixed 组。"
            }
            $tag = "v$version"

            $pending = Get-PendingChangesets
            if ($pending.Count -gt 0) {
              throw "changeset version 后仍有未消费的 changeset：$($pending -join ', ')。"
            }

            # tag 已存在 = 这个版本发布过了；说明没有新的 changeset 需要发布。
            # 注意：不要用 `git ls-remote --exit-code`（tag 不存在时返回 2，PowerShell
            # 进程退出码会沿用它 → 步骤失败）。这里用空输出判断，git 本身始终返回 0。
            $existingTag = (git ls-remote --tags origin "refs/tags/$tag" 2>$null) -join ''
            if ($existingTag.Trim()) {
              throw "tag $tag 已存在：没有新的 changeset 需要发布。如需重发该版本，请先删除对应的 Release 与 tag。"
            }
            Write-Host "changeset version 完成：$tag（教师端/学生端均为 $version）"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    name: Build ${{ matrix.label }}
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      # 一个产物失败不取消其他三路：把四份安装包的失败信息一次看全
      fail-fast: false
      matrix:
        include:
          - app: teacher
            pkg: '@c30/teacher'
            label: Teacher x64
            arch: x64
            script: build:win
          - app: teacher
            pkg: '@c30/teacher'
            label: Teacher arm64
            arch: arm64
            script: build:win:arm64
          - app: student
            pkg: '@c30/student'
            label: Student x64
            arch: x64
            script: build:win
          - app: student
            pkg: '@c30/student'
            label: Student arm64
            arch: arm64
            script: build:win:arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 每个构建 job 都在自己的干净检出里跑一次 version-packages：
      # changeset version 对同一份输入是确定性的，所以四路得到的版本号一致，
      # 不需要在 job 之间传递被改写的 package.json。
      - name: Bump version from changesets
        if: github.event_name == 'workflow_dispatch'
        run: pnpm version-packages

      - name: Build ${{ matrix.label }} installer
        run: pnpm --filter ${{ matrix.pkg }} ${{ matrix.script }}

      - name: Upload ${{ matrix.label }} installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.app }}-${{ matrix.arch }}
          path: apps/${{ matrix.app }}/release/C30-*-Setup-*-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # 四个构建 job 全部成功才放行；任一失败则整个 release 不执行
    needs: [resolve, build]
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      # 四份安装包汇总到这里，再原样上传到 Release。
      RELEASE_ASSET_DIR: release-assets
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动发布要提交版本变更并推回 main，需要完整历史
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      # 版本提交要用 version-packages 生成的 package.json + CHANGELOG，
      # 这里在干净检出上重放一次（产物已在 build 阶段生成，不受影响）。
      - name: Bump version from changesets
        if: github.event_name == 'workflow_dispatch'
        run: pnpm version-packages

      # 生成 SHA256SUMS 与 Release 说明。安装包文件名已由 build-installer.mjs 固定为 ASCII，
      # 这里只校验四份产物齐全（缺一份直接失败，避免发出半套 Release）。
      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $PWD $env:RELEASE_ASSET_DIR
          if (-not (Test-Path $outDir)) { throw "未下载到任何安装包：$outDir 不存在" }

          $apps = @(
            @{ Dir = 'teacher'; Label = 'Teacher' },
            @{ Dir = 'student'; Label = 'Student' }
          )
          $versions = @{}

          foreach ($app in $apps) {
            $version = (Get-Content (Join-Path $PWD "apps/$($app.Dir)/package.json") -Raw | ConvertFrom-Json).version
            foreach ($arch in @('x64', 'arm64')) {
              $src = Join-Path $outDir "C30-$($app.Label)-Setup-$version-$arch.exe"
              if (-not (Test-Path $src)) { throw "未找到 $arch 安装包：$src" }
              $len = (Get-Item $src).Length
              Write-Host ("· {0} ({1:N1} MB)" -f (Split-Path -Leaf $src), ($len / 1MB))
            }
            $versions[$app.Label] = $version
          }

          # 校验和：用户下载后可自行核对，便于内网分发。
          Get-ChildItem -Path $outDir -Filter '*.exe' -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path (Join-Path $outDir 'SHA256SUMS.txt') -Encoding ascii

          # 从 changeset version 生成的 CHANGELOG 中截取当前版本一节，作为 Release 变更说明。
          function Get-LatestChangelog([string]$path, [string]$version) {
            if (-not (Test-Path $path)) { return '' }
            $lines = Get-Content -Path $path
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s+$([regex]::Escape($version))\s*$") { $start = $i + 1; break }
            }
            if ($start -lt 0) { return '' }
            $end = $lines.Count
            for ($i = $start; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s') { $end = $i; break }
            }
            if ($end -le $start) { return '' }
            return (($lines[$start..($end - 1)]) -join "`n").Trim()
          }

          $teacherVersion = $versions['Teacher']
          $studentVersion = $versions['Student']
          $teacherNotes = Get-LatestChangelog (Join-Path $PWD 'apps/teacher/CHANGELOG.md') $teacherVersion
          $studentNotes = Get-LatestChangelog (Join-Path $PWD 'apps/student/CHANGELOG.md') $studentVersion

          # Release 说明：面向下载者的安装指引（单引号字符串，反引号保持字面量）。
          $notes = New-Object System.Collections.Generic.List[string]
          $notes.Add('## 下载安装包')
          $notes.Add('')
          $notes.Add('| 端 | 安装包 | 适用场景 |')
          $notes.Add('| --- | --- | --- |')
          $notes.Add(('| 教师端（发送端） | `C30-Teacher-Setup-{0}-x64.exe` | 教师机安装，启动即创建课堂并广播 |' -f $teacherVersion))
          $notes.Add(('| 学生端（接收端） | `C30-Student-Setup-{0}-x64.exe` | 学生机安装，自动发现并接入同一局域网内的课堂 |' -f $studentVersion))
          $notes.Add('')
          $notes.Add(('**版本**：教师端 {0} · 学生端 {1}（由 Changesets 生成，与 tag 一致）' -f $teacherVersion, $studentVersion))
          $notes.Add('')
          $notes.Add('- 系统要求：Windows 10 / 11（x64）')
          $notes.Add('- 完整性校验：附件 `SHA256SUMS.txt` 记录了 SHA-256，可用 `Get-FileHash .\安装包.exe -Algorithm SHA256` 比对')
          $notes.Add('- 安装包未做代码签名：Windows SmartScreen 可能提示“未知发布者”，选择“更多信息 → 仍要运行”即可')
          $notes.Add('- 教师端与学生端需处于同一局域网；首次运行时请允许 Windows 防火墙对“专用网络”的访问')

          if ($teacherNotes) {
            $notes.Add('')
            $notes.Add('## 本次变更')
            $notes.Add('')
            $notes.Add($teacherNotes)
          }
          if ($studentNotes -and $studentNotes -ne $teacherNotes) {
            $notes.Add('')
            $notes.Add('## 学生端变更')
            $notes.Add('')
            $notes.Add($studentNotes)
          }

          Set-Content -Path (Join-Path $PWD 'release-notes.md') -Value ($notes -join "`n") -Encoding utf8

          Write-Host "`n待上传附件："
          Get-ChildItem -Path $outDir -File | ForEach-Object { Write-Host " · $($_.Name)" }

      # 只有手动发布才需要把 changeset version 的产物写回仓库并打 tag；
      # 推 tag 路径下版本已由本地提交，这里不再改动仓库。
      # 放在构建之后：构建失败时仓库保持干净，不会留下“有 tag 没产物”的版本。
      - name: Commit version bump and tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 只提交 changeset version 改动的路径，避免把构建产物/发布说明带进版本提交。
          $dirty = git status --porcelain -- apps packages .changeset
          if ($dirty) {
            git add -A -- apps packages .changeset
            git commit -m "chore(release): $tag"
            if ($LASTEXITCODE -ne 0) { throw "提交版本变更失败（git exit $LASTEXITCODE）" }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw "推送版本提交失败（检查 main 分支保护与 workflow permissions）" }
            Write-Host "已提交版本变更并推送到 $env:GITHUB_REF_NAME"
          }
          else {
            Write-Host '工作区无版本变更（无待发布 changeset），直接对当前提交打 tag'
          }

          git tag $tag
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { throw "推送 tag $tag 失败（git exit $LASTEXITCODE）" }

      # 已有同名 Release 就覆盖上传（便于重跑），否则新建。
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # gh / git 的失败通过 $LASTEXITCODE 判断，不让 PowerShell 提前抛错。
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $draft = "${{ inputs.draft }}" -eq 'true'

          $assetsDir = Join-Path $PWD $env:RELEASE_ASSET_DIR
          $assets = @(Get-ChildItem -Path $assetsDir -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "$assetsDir 为空，没有可上传的安装包" }

          gh release view $tag --repo $repo *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            Write-Host "Release $tag 已存在，覆盖上传附件"
            gh release upload $tag @assets --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw "上传附件失败（gh exit $LASTEXITCODE）" }
          }
          else {
            $createArgs = @(
              'release', 'create', $tag, '--repo', $repo,
              '--title', "C30 局域网教学系统 $tag",
              '--notes-file', (Join-Path $PWD 'release-notes.md')
            )
            if ($draft) { $createArgs += '--draft' }
            # v0.2.0-beta.1 这类版本自动标 Pre-release。
            if ($tag -match '^v\d+\.\d+\.\d+-') { $createArgs += '--prerelease' }
            $createArgs += $assets

            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败（gh exit $LASTEXITCODE）" }
          }

          $releaseUrl = "$($env:GITHUB_SERVER_URL)/$repo/releases/tag/$tag"
          Write-Host "Release 地址：$releaseUrl"
          @(
            '### 已发布 Release',
            '',
            "- [$tag]($releaseUrl)（版本 $env:RELEASE_VERSION）",
            "- 附件：$($assets.Count) 个（安装包 + SHA256SUMS.txt）"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
